[build]
  # 1. Build Cortes 3D (Next.js static export → cortes/out)
  # 2. Build frontend (React/Vite → frontend/dist)
  # 3. Copy Cortes output into frontend/dist/cortes so both are served from the same domain
  command   = "cd cortes && pnpm install --ignore-scripts && pnpm run build && cd ../frontend && yarn install && yarn build && mkdir -p dist/cortes && cp -r ../cortes/out/. dist/cortes/"
  publish   = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION    = "22"
  NODE_OPTIONS    = "--max-old-space-size=4096"
  PNPM_VERSION    = "10"

# Kiwify webhook → Netlify Function
[[redirects]]
  from   = "/api/webhook/kiwify"
  to     = "/.netlify/functions/kiwify"
  status = 200

# Admin API → Netlify Function (must be before SPA fallback)
# :splat preserves the subroute so event.path contains /stats, /users, etc.
[[redirects]]
  from   = "/api/admin/*"
  to     = "/.netlify/functions/admin/:splat"
  status = 200

# ── Cortes 3D (Next.js static export) ────────────────────────────────────────
#
# REGRA CRÍTICA: NÃO usar force=true em /cortes/* pois impede o Netlify
# de servir arquivos estáticos reais (CSS, JS, fontes, imagens).
# force=true faz o Netlify ignorar arquivos existentes e sempre retornar index.html,
# quebrando completamente o carregamento de assets.
#
# /cortes (sem barra) → serve o index.html diretamente (sem 301, evita redirect loop)
[[redirects]]
  from   = "/cortes"
  to     = "/cortes/index.html"
  status = 200

# /cortes/* → SPA fallback: só atua se o arquivo NÃO existir em disco
# Arquivos reais (_next/static/css, js, fonts) são servidos diretamente pelo CDN
[[redirects]]
  from   = "/cortes/*"
  to     = "/cortes/index.html"
  status = 200

# ── SPA fallback do React (deve ser o último) ─────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
